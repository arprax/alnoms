[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alnoms"
version = "1.1.3"  # 0.5.1 Managed by promote_oss.py - Do not edit manually. If you do, always match it with the current github release
description = "Alnoms: The Performance Intelligence Engine"
dependencies = []
readme = "README.md"
authors = [{ name="Tanmoy Chowdhury", email="tanmoy@arprax.com" }]
maintainers = [{ name="Arprax Lab", email="lab@arprax.com" }]
requires-python = ">=3.9"
# Add keywords to help with Google/PyPI search visibility
keywords = ["algorithms", "sorting", "profiler", "industrial-cs", "alnoms", "arprax"]
# Add classifiers to show professionalism
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]

# --- Namespace Configuration ---
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alnoms", "alnoms.*"]
exclude = ["alnoms_pro*", "alnoms_enterprise*"] # Explicitly ban these from PyPI
namespaces = true

# --- Pytest Configuration ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"] # Tells pytest to look in src/ for the alnoms namespace
norecursedirs = ["tests/manual", "examples", ".*", "dist", "build", "venv"]
addopts = "--cov=src/alnoms --cov-report=term-missing --cov-branch" # Auto-triggers coverage

# --- Coverage Configuration (The Single Source of Truth) ---
[tool.coverage.run]
source = ["alnoms"]
# Ensure the archive is never measured during promote_oss.py runs
omit = [
    "*/legacy_archive/*",
    "src/alnoms/__main__.py",
    "src/alnoms/cli.py"
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "abstractmethod"
]

[tool.semantic_release]
#version_variable = ["pyproject.toml:project.version"]
version_toml = ["pyproject.toml:project.version"]
branch = "main" # Monitoring the PUBLIC main branch for releases
upload_to_pypi = false  # pipeline handles this
build_command = "" # false: GitHub Action handles the build

[project.scripts]
# This links the terminal command 'alnoms' to the main() function in cli.py
alnoms = "alnoms.cli:main"

[project.optional-dependencies]
dev = ["build", "twine", "pytest", "pytest-cov", "ruff"]

[project.urls]
"Homepage" = "https://alnoms.com/"
"Documentation" = "https://alnoms.com/reference/api/"
"Source" = "https://github.com/arprax/alnoms"
"Tracker" = "https://github.com/arprax/alnoms/issues"
"Arprax" = "https://www.arprax.com/"